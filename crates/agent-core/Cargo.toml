[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Provider-agnostic Agent Runtime for Android Toolkit"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock"] }
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
base64 = "0.22"
regex = "1"
globset = "0.4"
libssh2-sys = "0.3.2"
num-bigint = "0.4"
ssh2 = "0.9"
rquickjs = { version = "0.8", features = ["array-buffer", "classes"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "process", "time", "sync", "net"] }
# P1-B：取消链路使用 CancellationToken 打断任意 await（sync 模块默认可用，无需特性）。
tokio-util = "0.7"
thiserror = "2"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
# ring 后端必选其一（0.64 强制）；rsa + flate2(miniz_oxide) 均纯 Rust。
# 本机 VS18 14.50 cl.exe 损坏（D8050），aws-lc-sys 的 C 编译体量远大于 ring，
# 且 src-tauri/target 已有 ring 0.17 完好缓存可直接复用。
russh = { version = "0.64.1", default-features = false, features = ["flate2", "rsa", "ring"] }
russh-sftp = "3.0.1"

# G3-A：Windows 受限令牌降权启动（CreateRestrictedToken / CreateProcessAsUserW）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_IO"] }

[dev-dependencies]
